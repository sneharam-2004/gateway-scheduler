name: Direct probe

# One-off: what a viewer's browser gets from the upstream media hosts when it
# fetches them itself (no Referer, Origin null). Prints counts per anonymous
# host only. Remove once read.

on:
  workflow_dispatch:
    inputs:
      n:
        description: 'Samples per kind'
        type: number
        default: 25
      mode:
        description: 'probe (headers) or browser (the real player, direct and blocked)'
        type: string
        default: probe

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the private pipeline
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.PRIVATE_REPO }}
          ref: main
          ssh-key: ${{ secrets.PIPELINE_DEPLOY_KEY }}
          path: pipeline
          fetch-depth: 1
      - name: Install the token library
        run: python3 -m pip install --quiet cryptography
      - name: Probe
        if: inputs.mode == 'probe'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.SYNC_CF_TOKEN }}
        run: python3 pipeline/scripts/watch/direct_probe.py --n "${{ inputs.n }}"
      - uses: actions/setup-node@v4
        if: inputs.mode == 'browser'
        with:
          node-version: 22
      - name: Browser
        if: inputs.mode == 'browser'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.SYNC_CF_TOKEN }}
        run: |
          python3 pipeline/scripts/watch/direct_probe.py --samples "$RUNNER_TEMP/samples.json"
          cd pipeline/scripts/watch/direct-harness
          npm init -y >/dev/null && npm i --silent playwright@1.62.1 >/dev/null
          npx playwright install --with-deps chromium >/dev/null 2>&1
          E="$RUNNER_TEMP/echo"; mkdir -p "$E"
          sudo apt-get install -y -qq ffmpeg >/dev/null 2>&1 || true
          ffmpeg -loglevel error -f lavfi -i testsrc=duration=8:size=320x240:rate=25 -c:v libx264 -g 50 -f hls -hls_time 2 -hls_playlist_type vod "$E/master.m3u8"
          ffmpeg -loglevel error -f lavfi -i testsrc=duration=8:size=320x240:rate=25 -c:v libx264 -movflags +faststart "$E/clip.mp4"
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 -subj /CN=localhost -keyout "$E/key.pem" -out "$E/cert.pem" 2>/dev/null
          ECHO_DIR="$E" node run.mjs "$RUNNER_TEMP/samples.json"
