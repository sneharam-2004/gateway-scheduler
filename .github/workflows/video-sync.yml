name: Video sync

# WHAT THIS DOES
#
# Adds the videos the upstream published since the last run, for people the
# site already has, as rows that stream through the site's own proxies. It
# reads the upstream's full video listing (nine requests), keeps the items
# dated inside a 14-day window behind the last good run, drops what is already
# held, checks every remaining video and still through the site's /v/ and /i/
# proxies exactly as a visitor's browser would load them, writes the ones that
# pass, and drops the cached copies of the person pages they appear on.
#
# Sundays read every listed item instead of the window, because an item can
# be listed with an old date, and a window never sees it.
#
# The watermark moves only on a run where every check passed, so a failed run
# is re-read next time rather than skipped. The listing, the verify rate, the
# write count and the page purge are separate checks; any one failing mails.
#
# Why a hosted runner: the upstream's names are blocked on the home network
# (DNS sinkhole and TLS reset, measured 2026-10-23), so nothing on the home
# line can read the listing.
#
# Nothing here names a host. The script scrubs hosts from every error it
# prints, and nothing is uploaded, because this repository is public.
#
# The cron went on after the first dispatch run was read end to end on
# 2026-10-23, following the 7,262-item backfill and two piloted writes whose
# pages were rendered and checked from outside.

on:
  schedule:
    - cron: '50 2 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'window: items dated since the last good run; full: every listed item'
        type: choice
        options: [window, full]
        default: window
      limit:
        description: 'Write at most this many rows (0 = no cap)'
        type: number
        default: 0
      dry_run:
        description: 'Plan and verify, write nothing'
        type: boolean
        default: false

concurrency:
  group: video-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      # This repo first, at the root: it carries the mailer, which must not be
      # able to go missing.
      - uses: actions/checkout@v4

      - name: Check out the private pipeline
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.PRIVATE_REPO }}
          ref: main
          ssh-key: ${{ secrets.PIPELINE_DEPLOY_KEY }}
          path: pipeline
          fetch-depth: 1

      # The proxy tokens are AES-GCM; the standard library has no AES. Not in
      # the alert path: the mailer below is standard library and already here.
      - name: Install the token library
        run: python3 -m pip install --quiet cryptography

      # SYNC_CF_TOKEN is scoped to D1, the page-cache bucket and a cache purge
      # on this one zone. It cannot read or delete the media bucket.
      - name: Sync
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.SYNC_CF_TOKEN }}
          IMAGE_SECRET: ${{ secrets.IMAGE_SECRET }}
          VIDEO_SECRET: ${{ secrets.VIDEO_SECRET }}
        run: |
          mode="${{ inputs.mode || 'window' }}"
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$(date -u +%u)" = "7" ]; then mode=full; fi
          python3 pipeline/scripts/watch/video_sync.py --"$mode" \
            $([ "${{ inputs.limit || 0 }}" != "0" ] && echo "--limit ${{ inputs.limit }}") \
            ${{ inputs.dry_run && '--dry-run' || '' }} \
            --json video-sync.json

      - name: Report
        if: always()
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ALERT_EMAIL:    ${{ secrets.ALERT_EMAIL }}
          EMAIL_FROM:     ${{ secrets.EMAIL_FROM }}
          ALERT_PREFIX:   ${{ secrets.ALERT_PREFIX }}
          JOB_STATUS:     ${{ job.status }}
          RUN_URL:        ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python3 scripts/report.py --status "$JOB_STATUS" --json video-sync.json --label "video sync"
