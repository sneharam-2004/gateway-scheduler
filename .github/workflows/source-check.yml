name: Source URL map

# WHY THIS EXISTS
#
# The pipeline used to build entity URLs by hand from a slug. That format is
# real but incomplete, so when the upstream moved its biggest entities to a
# different URL shape, every constructed URL began returning 404 and nothing
# said so. Three wrong diagnoses followed, each built on the last, each
# looking confirmed: rate limiting, then a block by address, then a takedown.
# The pages had been there the whole time.
#
# This check asks the only question that would have caught it on day one: are
# the URLs we are about to crawl real? It resolves them from the upstream's own
# index, samples some, and fetches them.
#
# It fails loudly on a stale map rather than letting a crawl run against URLs
# that do not exist, because a crawl on dead URLs looks exactly like an upstream
# with nothing new.

on:
  workflow_dispatch:
    inputs:
      sample:
        description: 'How many resolved URLs to fetch as proof'
        type: number
        default: 25

# No schedule yet, on purpose. Nothing here goes on a cron until a dispatch-only
# run has been read end to end by a human.

concurrency:
  group: source-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      # This repo first, at the root: it carries the mailer, which must not be
      # able to go missing. An alert step may only use what is present before
      # the first step that can fail.
      - uses: actions/checkout@v4

      - name: Check out the private pipeline
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.PRIVATE_REPO }}
          ref: main
          ssh-key: ${{ secrets.PIPELINE_DEPLOY_KEY }}
          path: pipeline
          fetch-depth: 1

      # Standard library only, so no pip step sits in the alert path.
      - name: Resolve and verify
        run: |
          python3 pipeline/scripts/watch/source_urls.py \
            --refresh \
            --verify ${{ inputs.sample }} \
            --json check.json
        env:
          SOURCE_URL_CACHE: ${{ runner.temp }}/source-urls.json

      - name: Report
        if: always()
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ALERT_EMAIL:    ${{ secrets.ALERT_EMAIL }}
          EMAIL_FROM:     ${{ secrets.EMAIL_FROM }}
          JOB_STATUS:     ${{ job.status }}
          RUN_URL:        ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python3 scripts/report.py --status "$JOB_STATUS" --json check.json --label "source url map"
