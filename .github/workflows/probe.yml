name: Reachability probe

# WHY THIS RUNS BEFORE ANYTHING ELSE
#
# The schedule depends on one number nobody has measured from a hosted runner:
# how many requests an upstream answers before it starts resetting connections.
#
# Measured 2026-09-13 from two other IPs:
#   a residential IP    upstream A: reset on request 1
#   a datacenter IP     upstream A: 6/10 at one request per 10s
#   both                upstream B: 12/12 clean
#
# So upstream A throttles connections rather than banning addresses, and the
# residential IP is separately burned from an older run. A hosted runner is a
# third address and its behaviour follows from neither. Nothing is scheduled
# against upstream A until this job reports what a hosted runner actually gets.
#
# Dispatch only, on purpose. A probe on a cron is just an unpoliced crawler.

on:
  workflow_dispatch:
    inputs:
      max_requests:
        description: 'Requests per upstream (keep low; raise only after a clean run)'
        type: number
        default: 12
      delay_seconds:
        description: 'Seconds between requests'
        type: number
        default: 10

concurrency:
  group: probe
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      # This repo first, at the root. It carries the mailer, which must not be
      # able to go missing: on the first run the private checkout failed, every
      # later step was skipped including the one that mails, and the failure
      # went unreported. The alert cannot share fate with what it watches.
      - uses: actions/checkout@v4

      # Code, targets and selectors live in the private repo, mounted in a
      # subdirectory so it cannot displace the mailer above.
      #
      # A read-only DEPLOY KEY, not a PAT. A fine-grained PAT grants whatever
      # its repository-access list says, which is an account-wide setting that
      # cannot be read or changed from the API and drifted wrong here for two
      # days. This key is scoped to one repository, is read-only, and is
      # revocable in one command without touching anything else.
      - name: Check out the private pipeline
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.PRIVATE_REPO }}
          ssh-key: ${{ secrets.PIPELINE_DEPLOY_KEY }}
          path: pipeline
          fetch-depth: 1

      # Exits non-zero when an upstream refused, so a blocked runner turns the
      # run red instead of filing a tidy summary nobody reads.
      #
      # No artifact upload. The JSON records the URL of every request, and an
      # artifact on a public repository is world-downloadable. The run log
      # carries the same table without the hosts, which is the whole point of
      # the split.
      - name: Probe
        run: |
          python3 pipeline/scripts/watch/rate_probe.py \
            --all \
            --max ${{ inputs.max_requests }} \
            --delay ${{ inputs.delay_seconds }} \
            --json probe.json

      # always(), because the interesting run is the one that failed. Standard
      # library only, so it needs neither setup-python nor pip, both of which
      # are steps that can be skipped.
      - name: Report
        if: always()
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ALERT_EMAIL:    ${{ secrets.ALERT_EMAIL }}
          EMAIL_FROM:     ${{ secrets.EMAIL_FROM }}
          JOB_STATUS:     ${{ job.status }}
          RUN_URL:        ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python3 scripts/report.py --status "$JOB_STATUS" --json probe.json
